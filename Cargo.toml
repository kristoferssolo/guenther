[package]
name = "guenther"
version = "0.1.0"
authors = ["Kristofers Solo <dev@kristofers.xyz>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
voice-line-capture = []

[dependencies]
async-trait = "0.1"
capitalize = "0.3.4"
color-eyre = "0.6"
dotenv = "0.15"
futures = "0.3"
infer = "0.22"
rand = "0.10"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.17", default-features = false, features = [
  "ctrlc_handler",
  "macros",
  "rustls",
] }
tempfile = "3"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
] }
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
url = "2.5"

[dev-dependencies]
claims = "0.8"
rstest = "0.26"
temp-env = "0.3"

[lints.clippy]
nursery = "warn"
pedantic = "warn"
unwrap_used = "warn"
